[project]
name = "glass-cockpit-agent"
version = "0.1.0"
description = "LiveKit voice agent that publishes its own live telemetry"
requires-python = ">=3.12"
dependencies = [
    "livekit-agents>=1.6.8,<2",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.uv]
# Flat scripts, not an installable distribution.
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
